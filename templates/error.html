{% extends "base.html" %}

{% block title %}Error {{ codigo }} - Sistema de Incidencias{% endblock %}

{% block breadcrumb %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{{ url_for('dashboard') }}">Inicio</a></li>
        <li class="breadcrumb-item active" aria-current="page">Error {{ codigo }}</li>
    </ol>
</nav>
{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <div class="card border-danger">
            <div class="card-body py-5">
                <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 4rem;"></i>
                <h1 class="display-4 mt-3">{{ codigo }}</h1>
                <p class="lead text-muted">{{ error|default('Ha ocurrido un error inesperado.') }}</p>
                <hr>
                <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
                    <i class="bi bi-house"></i> Volver al inicio
                </a>
                <button class="btn btn-outline-secondary ms-2" onclick="history.back()">
                    <i class="bi bi-arrow-left"></i> Volver atras
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
