{% extends "portal/base.html" %}

{% block title %}Nueva Incidencia - Portal del Cliente{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">
                    <i class="bi bi-plus-circle"></i> Reportar un Problema
                </h4>
            </div>
            <div class="card-body">
                <form method="post" action="{{ url_for('portal_nueva_incidencia') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label for="titulo" class="form-label">
                            Titulo del problema <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" id="titulo" name="titulo"
                               placeholder="Ej: No puedo acceder a internet" required maxlength="200">
                        <div class="form-text">Describe brevemente el problema en una linea.</div>
                    </div>

                    <div class="mb-3">
                        <label for="descripcion" class="form-label">
                            Descripcion detallada
                        </label>
                        <textarea class="form-control" id="descripcion" name="descripcion"
                                  rows="5"
                                  placeholder="Describe el problema con el mayor detalle posible: que paso, cuando empezo, que mensajes de error aparecen, que equipos estan afectados..."></textarea>
                        <div class="form-text">Mientras mas detalles nos des, mas rapido podremos resolver tu problema.</div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="categoria" class="form-label">Tipo de problema</label>
                            <select class="form-select" id="categoria" name="categoria">
                                <option value="">No estoy seguro</option>
                                {% for cat in categorias %}
                                <option value="{{ cat }}">{{ cat|capitalize }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="prioridad" class="form-label">Urgencia</label>
                            <select class="form-select" id="prioridad" name="prioridad">
                                <option value="baja">Baja - Puede esperar</option>
                                <option value="media" selected>Media - Normal</option>
                                <option value="alta">Alta - Afecta mi trabajo</option>
                                <option value="critica">Critica - Todo detenido</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-send"></i> Enviar Incidencia
                        </button>
                        <a href="{{ url_for('portal_dashboard') }}" class="btn btn-outline-secondary btn-lg">
                            <i class="bi bi-x-lg"></i> Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
