<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Registro - Sistema de Incidencias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0d6efd 0%, #084298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }
        .register-card {
            max-width: 520px;
            width: 100%;
            border-radius: 1rem;
            box-shadow: 0 1rem 3rem rgba(0,0,0,.25);
        }
    </style>
</head>
<body>
    <div class="card register-card">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <i class="bi bi-person-plus-fill text-primary" style="font-size: 3rem;"></i>
                <h3 class="mt-2">Crear Cuenta</h3>
                <p class="text-muted">Registrate para gestionar tus incidencias</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="alert alert-{{ category if category != 'message' else 'info' }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="post" action="{{ url_for('registro') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label for="nombre" class="form-label">
                        <i class="bi bi-person"></i> Nombre completo <span class="text-danger">*</span>
                    </label>
                    <input type="text" class="form-control" id="nombre" name="nombre"
                           placeholder="Ej: Martin Aguiar" required maxlength="200">
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="email" class="form-label">
                            <i class="bi bi-envelope"></i> Email
                        </label>
                        <input type="email" class="form-control" id="email" name="email"
                               placeholder="tu@email.com" maxlength="200">
                    </div>
                    <div class="col-md-6">
                        <label for="telefono" class="form-label">
                            <i class="bi bi-telephone"></i> Telefono
                        </label>
                        <input type="text" class="form-control" id="telefono" name="telefono"
                               placeholder="11-1234-5678" maxlength="30">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="empresa" class="form-label">
                        <i class="bi bi-building"></i> Empresa
                    </label>
                    <input type="text" class="form-control" id="empresa" name="empresa"
                           placeholder="Nombre de tu empresa (opcional)" maxlength="200">
                </div>

                <hr class="my-4">

                <div class="mb-3">
                    <label for="username" class="form-label">
                        <i class="bi bi-at"></i> Nombre de usuario <span class="text-danger">*</span>
                    </label>
                    <input type="text" class="form-control" id="username" name="username"
                           placeholder="Minimo 3 caracteres" required minlength="3" maxlength="50">
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="password" class="form-label">
                            <i class="bi bi-lock"></i> Contrasena <span class="text-danger">*</span>
                        </label>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="Minimo 6 caracteres" required minlength="6">
                    </div>
                    <div class="col-md-6">
                        <label for="password2" class="form-label">
                            <i class="bi bi-lock-fill"></i> Repetir <span class="text-danger">*</span>
                        </label>
                        <input type="password" class="form-control" id="password2" name="password2"
                               placeholder="Repetir contrasena" required minlength="6">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 btn-lg">
                    <i class="bi bi-check-circle"></i> Crear mi Cuenta
                </button>
            </form>

            <div class="text-center mt-4">
                <p class="text-muted mb-0">
                    Ya tenes cuenta?
                    <a href="{{ url_for('login') }}">Inicia sesion</a>
                </p>
                <a href="{{ url_for('landing') }}" class="text-muted small">
                    <i class="bi bi-arrow-left"></i> Volver al inicio
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
