{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if cliente else 'Nuevo' }} Cliente{% endblock %}
{% block contenido %}
<h4 class="mb-4">{{ 'Editar' if cliente else 'Nuevo' }} Cliente</h4>

<div class="card p-4">
    <form method="post">
        <div class="mb-3">
            <label class="form-label">Nombre *</label>
            <input type="text" name="nombre" class="form-control" required value="{{ cliente.nombre if cliente else '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" value="{{ cliente.email if cliente and cliente.email else '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Telefono</label>
            <input type="text" name="telefono" class="form-control" value="{{ cliente.telefono if cliente and cliente.telefono else '' }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Empresa</label>
            <input type="text" name="empresa" class="form-control" value="{{ cliente.empresa if cliente and cliente.empresa else '' }}">
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="{{ url_for('lista_clientes') }}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
