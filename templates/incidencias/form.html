{% extends "base.html" %}

{% block title %}Nueva Incidencia - Sistema de Incidencias{% endblock %}

{% block breadcrumb %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{{ url_for('dashboard') }}">Inicio</a></li>
        <li class="breadcrumb-item"><a href="{{ url_for('lista_incidencias') }}">Incidencias</a></li>
        <li class="breadcrumb-item active" aria-current="page">Nueva Incidencia</li>
    </ol>
</nav>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">
                    <i class="bi bi-plus-circle"></i> Nueva Incidencia
                </h4>
            </div>
            <div class="card-body">
                <form method="post" action="{{ url_for('nueva_incidencia') }}" id="formIncidencia">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label for="titulo" class="form-label">Titulo <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="titulo" name="titulo"
                               required maxlength="200">
                    </div>

                    <div class="mb-3">
                        <label for="descripcion" class="form-label">Descripcion</label>
                        <textarea class="form-control" id="descripcion" name="descripcion"
                                  rows="5"></textarea>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="cliente_id" class="form-label">Cliente</label>
                            <select class="form-select" id="cliente_id" name="cliente_id">
                                <option value="">Seleccionar cliente...</option>
                                {% for c in clientes %}
                                <option value="{{ c.id }}">{{ c.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="tecnico_id" class="form-label">Tecnico asignado</label>
                            <select class="form-select" id="tecnico_id" name="tecnico_id">
                                <option value="">Sin asignar</option>
                                {% for t in tecnicos %}
                                <option value="{{ t.id }}">{{ t.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mt-1">
                        <div class="col-md-6">
                            <label for="prioridad" class="form-label">Prioridad</label>
                            <select class="form-select" id="prioridad" name="prioridad">
                                {% for p in prioridades|default(['baja','media','alta','critica']) %}
                                <option value="{{ p }}" {{ 'selected' if p == 'media' }}>
                                    {{ p|capitalize }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="categoria" class="form-label">
                                Categoria
                                {% if ia_disponible %}
                                <button type="button" class="btn btn-sm btn-outline-info ms-2"
                                        id="btnAutoClasificar" title="Clasificar con IA">
                                    <i class="bi bi-robot"></i> Auto-clasificar
                                </button>
                                {% endif %}
                            </label>
                            <select class="form-select" id="categoria" name="categoria">
                                <option value="">Sin categoria</option>
                                {% for cat in categorias|default(['hardware','software','red','email','seguridad','otro']) %}
                                <option value="{{ cat }}">{{ cat|capitalize }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> Crear Incidencia
                        </button>
                        <a href="{{ url_for('lista_incidencias') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-lg"></i> Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('btnAutoClasificar')?.addEventListener('click', function() {
    const titulo = document.getElementById('titulo').value;
    const descripcion = document.getElementById('descripcion').value;

    if (!titulo && !descripcion) {
        alert('Introduce un titulo o descripcion para auto-clasificar.');
        return;
    }

    const btn = this;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Clasificando...';

    const formData = new FormData();
    formData.append('titulo', titulo);
    formData.append('descripcion', descripcion);

    fetch('{{ url_for("ia_clasificar") }}', {
        method: 'POST',
        headers: { 'X-CSRFToken': document.querySelector('meta[name=csrf-token]').content },
        body: formData
    })
    .then(r => r.json())
    .then(data => {
        if (data.categoria) {
            document.getElementById('categoria').value = data.categoria;
        }
        if (data.prioridad) {
            document.getElementById('prioridad').value = data.prioridad;
        }
    })
    .catch(err => alert('Error al clasificar: ' + err.message))
    .finally(() => {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-robot"></i> Auto-clasificar';
    });
});
</script>
{% endblock %}
